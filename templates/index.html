<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    
    <!-- Meta Description -->
    <meta name="description" content="Securely manage and store your passwords in one safe place">
    
    <!-- Open Graph / Facebook / Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="🔐 Password Manager">
    <meta property="og:description" content="Securely manage and store your passwords in one safe place">
    <meta property="og:image" content="/static/images/og-image.png">
    <meta property="og:url" content="">
    <meta property="og:site_name" content="Password Manager">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🔐 Password Manager">
    <meta name="twitter:description" content="Securely manage and store your passwords in one safe place">
    <meta name="twitter:image" content="/static/images/og-image.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header role="banner">
            <h1>🔐 Password Manager</h1>
            <p class="subtitle">Securely manage your passwords</p>
        </header>
        
        <nav class="toolbar" role="toolbar" aria-label="Password management toolbar">
            <div class="search-container">
                <label for="searchInput" class="sr-only">Search passwords</label>
                <input type="text" id="searchInput" placeholder="Search passwords..." class="search-input" aria-label="Search passwords">
            </div>
            <button id="addBtn" class="btn btn-primary" aria-label="Add new password">+ Add Password</button>
        </nav>
        
        <main role="main">
            <div id="passwordList" class="password-list" role="list" aria-label="Password entries">
                <div class="loading" role="status" aria-live="polite">Loading passwords...</div>
            </div>
        </main>
    </div>
    
    <!-- Modal for Add/Edit Password -->
    <div id="passwordModal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Password</h2>
                <button class="close-btn" id="closeModal" aria-label="Close modal">&times;</button>
            </div>
            <form id="passwordForm" aria-label="Password entry form">
                <input type="hidden" id="entryId">
                
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" required placeholder="e.g., Gmail Account">
                </div>
                
                <div class="form-group">
                    <label for="username">Username/Email</label>
                    <input type="text" id="username" placeholder="username@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="password-input-group">
                        <input type="password" id="password" required placeholder="Enter password">
                        <button type="button" id="togglePassword" class="btn-icon" title="Show/Hide password">👁️</button>
                        <button type="button" id="generatePassword" class="btn-icon" title="Generate password">🎲</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="url">URL/Website</label>
                    <input type="url" id="url" placeholder="https://example.com">
                </div>
                
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="3" placeholder="Additional notes..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Password Generator Modal -->
    <div id="generatorModal" class="modal" role="dialog" aria-labelledby="generatorModalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="generatorModalTitle">Generate Password</h2>
                <button class="close-btn" id="closeGeneratorModal" aria-label="Close password generator">&times;</button>
            </div>
            <div class="generator-content">
                <div class="form-group">
                    <label for="genLength">Length: <span id="lengthValue">16</span></label>
                    <input type="range" id="genLength" min="8" max="64" value="16">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="genUppercase" checked> Include Uppercase
                    </label>
                    <label>
                        <input type="checkbox" id="genLowercase" checked> Include Lowercase
                    </label>
                    <label>
                        <input type="checkbox" id="genNumbers" checked> Include Numbers
                    </label>
                    <label>
                        <input type="checkbox" id="genSymbols" checked> Include Symbols
                    </label>
                </div>
                
                <div class="form-group">
                    <label for="generatedPassword">Generated Password</label>
                    <div class="password-input-group">
                        <input type="text" id="generatedPassword" readonly>
                        <button type="button" id="copyGenerated" class="btn-icon" title="Copy password">📋</button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="regenerateBtn" class="btn btn-secondary">Regenerate</button>
                    <button type="button" id="useGeneratedBtn" class="btn btn-primary">Use This Password</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
